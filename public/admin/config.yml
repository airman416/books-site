backend:
  name: git-gateway
  branch: main

# Uncomment for local development
# local_backend: true

media_folder: "public/images"
public_folder: "/images"

# Disable the editor preview pane globally for better mobile experience
editor:
  preview: false

# Global markdown configuration
markdown:
  # Enable markdown shortcuts and features
  shortcuts: true
  # Default to markdown for rich text fields
  default: true

collections:
  # Blog Posts Collection
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true, hint: "Toggle to show/hide this post on your website" }
      - { label: "Author", name: "author", widget: "string", default: "Armaan Agrawal", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Topic", name: "topic", widget: "string", required: false, hint: "e.g., 'Startups', 'Productivity', 'Technology'" }
      - label: "More Essays Section"
        name: "moreEssays"
        widget: "object"
        required: false
        hint: "Configure related essays to show at the bottom of this post"
        fields:
          - { label: "Heading", name: "heading", widget: "string", default: "More essays", required: false }
          - label: "Essay Links"
            name: "links"
            widget: "list"
            required: false
            hint: "Links to other essays shown at the bottom of this blog post"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", hint: "e.g., /blog/post-slug", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        default: ""
        hint: "Write your blog post content in Markdown format"
        buttons:
          - "bold"
          - "italic"
          - "link"
          - "heading-one"
          - "heading-two"
          - "heading-three"
          - "heading-four"
          - "heading-five"
          - "heading-six"
          - "code"
          - "quote"
          - "bulleted-list"
          - "numbered-list"

  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Site Configuration"
        name: "site"
        file: "src/data/siteSettings.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site Title", name: "title", widget: "string", required: false }
              - { label: "Site Description", name: "description", widget: "text", required: false }
              - { label: "Initials (top left logo)", name: "initials", widget: "string", required: false }
              - { label: "Twitter Handle", name: "twitter", widget: "string", required: false }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Brand Name", name: "brandName", widget: "string", required: false }
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Copyright Name", name: "copyrightName", widget: "string", required: false }
              - label: "Navigation Links"
                name: "navigation"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
              - label: "Social Links"
                name: "socialLinks"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
              - label: "Resume Link"
                name: "resumeLink"
                widget: "object"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "File", name: "file", widget: "file", media_folder: "public", public_folder: "/", required: false }

  # Home Page Content
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/data/homePage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "text", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
              - label: "Primary Button"
                name: "primaryButton"
                widget: "object"
                required: false
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
              - label: "Secondary Button"
                name: "secondaryButton"
                widget: "object"
                required: false
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
          - label: "About Preview Section"
            name: "aboutPreview"
            widget: "object"
            required: false
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" }, required: false }
              - label: "Link"
                name: "link"
                widget: "object"
                required: false
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
          - label: "Featured Work Section"
            name: "featuredWork"
            widget: "object"
            required: false
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Work Items"
                name: "workItems"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Latest Writing"
                name: "latestWriting"
                widget: "object"
                required: false
                fields:
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - label: "View All Link"
                    name: "viewAllLink"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "Text", name: "text", widget: "string", required: false }
                      - { label: "URL", name: "url", widget: "string", required: false }
          - label: "Writing Sections (by Topic)"
            name: "writingSections"
            widget: "list"
            required: false
            hint: "Configure sections to display blog posts by topic. Leave empty to show all recent posts."
            fields:
              - { label: "Section Title", name: "title", widget: "string", hint: "e.g., 'Startups', 'Productivity'", required: false }
              - { label: "Topic Filter", name: "topic", widget: "string", hint: "Must match the topic field in blog posts", required: false }
          - label: "Challenge Quiz Section"
            name: "challengeQuiz"
            widget: "object"
            required: false
            hint: "Display a link to the challenge quiz below essays and above newsletter"
            fields:
              - { label: "Show", name: "show", widget: "boolean", default: false, hint: "Toggle to show/hide the challenge quiz link" }
              - { label: "Text", name: "text", widget: "string", hint: "The entire text that will be clickable as a link", required: false }
              - { label: "Link URL", name: "url", widget: "string", default: "/30du", hint: "URL to the challenge quiz page", required: false }
          - label: "Newsletter Section"
            name: "newsletter"
            widget: "object"
            required: false
            fields:
              - { label: "Description", name: "description", widget: "text", hint: "Text shown above the newsletter signup form", required: false }
          - label: "Call-to-Action Section"
            name: "cta"
            widget: "object"
            required: false
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "File", name: "file", widget: "file", media_folder: "public", public_folder: "/", required: false }

      - label: "About Page"
        name: "about"
        file: "src/data/aboutPage.json"
        fields:
          - label: "Header"
            name: "header"
            widget: "object"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "text", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
          - label: "Content Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" }, required: false }
              - { label: "Bullet Points", name: "bulletPoints", widget: "list", field: { label: "Point", name: "point", widget: "string" }, required: false }
              - { label: "Paragraphs After Bullets", name: "afterBullets", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" }, required: false }
              - label: "Social Links"
                name: "socialLinks"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
          - label: "Resume Section"
            name: "resumeSection"
            widget: "object"
            required: false
            fields:
              - { label: "Button Text", name: "buttonText", widget: "string", required: false }
              - { label: "File", name: "file", widget: "file", media_folder: "public", public_folder: "/", required: false }
